apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: microservices
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/HumayunChaudhary/eks-microservices-gitops.git
        revision: main
        directories:
          - path: kubernetes/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/HumayunChaudhary/eks-microservices-gitops.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server:  https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
