name: Accounting service CI/CD 

on:
  push:
    branches:
      - main
    paths:
      - "src/accounting/**"
      - "kubernetes/accounting/**"
  workflow_dispatch:

jobs:
  gitleaks-scan:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Run Gitleaks scan
        run: |
          docker run --rm \
          -v "${{ github.workspace }}:/repo" \
          zricethezav/gitleaks:latest \
          detect \
          --source=/repo/src/accounting/ \
          --report-format=json \
          --report-path=/repo/gitleaks-report.json \
          --redact \
          --exit-code 0
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  checkov-k8s:
    name: Checkov scan for K8s manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov scan
        run: |
          checkov -d ./kubernetes/accounting/ \
          --framework kubernetes \
          --output json > checkov-k8s-report.json || true
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-k8s-report
          path: checkov-k8s-report.json
          if-no-files-found: warn

  docker-build:
    name: Build scan & push docker image
    runs-on: ubuntu-latest
    needs:
      - checkov-k8s
      - gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Build docker image
        run: |
          docker build -t accounting-svc:${{ github.sha }} -f src/accounting/Dockerfile .
      - name: Verify image creation
        run: docker images
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: accounting-svc:${{ github.sha }} 
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH
          exit-code: 0
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn
          
      - name: Login to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Push docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/accounting-svc:${{ github.sha }}

  
  update-k8s-manifest:
    name: Update K8S manifest
    runs-on: ubuntu-latest
    needs:
      - docker-build
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Update image name
        run: |
          sed -i "s|^ *image: .*|image: ${{ secrets.DOCKER_USERNAME }}/accounting-svc:${{ github.sha }}|g" ./kubernetes/accounting/deploy.yaml
      - name: Verify changed image name
        run: cat ./kubernetes/accounting/deploy.yaml
      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./kubernetes/accounting/deploy.yaml
          git commit -m "Update image tag to ${GITHUB_SHA} [skip ci]"
          git push origin main
